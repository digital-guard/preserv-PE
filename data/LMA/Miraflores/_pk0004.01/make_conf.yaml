layers:

  geoaddress:
    subtype: full
    method: shp2sql
    file: 1
    orig_filename: ADDRESS FOR ALL/numeros_puerta
    # geometria original: segmentos de linha (~2 m) junto à porta; usa-se o centróide.
    # via obtida por join cod_via com vias_mir.
    sql_view: SELECT gid, cod_manzan, cod_lote, cod_via, trim(nro_puerta || ' ' || coalesce(letra_puer,'')) AS hnum, tipo, estado, ST_Centroid(geom) AS geom FROM $(tabname)
    standardized_fields:
     -
      name: nro_puerta letra_puer
      standard: hnum
    other_fields:
     -
      name: cod_manzan
     -
      name: cod_lote
     -
      name: cod_via
     -
      name: tipo
     -
      name: estado

  via:
    subtype: full
    method: shp2sql
    file: 1
    orig_filename: ADDRESS FOR ALL/vias_mir
    sql_view: SELECT gid, cod_via::int AS cod_via, tipo, nomenclatu AS via, clasificac, geom FROM $(tabname)
    standardized_fields:
     -
      name: nomenclatu
      standard: via
    other_fields:
     -
      name: cod_via
     -
      name: tipo
     -
      name: clasificac

  parcel:
    subtype: full
    method: shp2sql
    file: 1
    orig_filename: ADDRESS FOR ALL/lotes_mir
    sql_select: ['gid', 'cod_catast AS ref', 'sector', 'cod_manzan', 'cod_lote', 'tipo_lote', 'cuc1', 'geom']
    standardized_fields:
     -
      name: cod_catast
      standard: ref
    other_fields:
     -
      name: sector
     -
      name: cod_manzan
     -
      name: cod_lote
     -
      name: tipo_lote
     -
      name: cuc1

  block:
    subtype: full
    method: shp2sql
    file: 1
    orig_filename: ADDRESS FOR ALL/manzanas_mir
    sql_select: ['gid', 'cod_manzan AS ref', 'mz_urbana', 'geom']
    standardized_fields:
     -
      name: cod_manzan
      standard: ref
    other_fields:
     -
      name: mz_urbana

comments: Também possui area_recreacional_mir (praças/parques) e limite_distrital.
